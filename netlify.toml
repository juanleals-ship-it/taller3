# Configuración de Netlify: se lee sola al conectar el repositorio

[build]
  command = "npm run build"
  publish = "dist"

# /api/... se redirige a la API de Dragon Ball (evita problemas de CORS)
[[redirects]]
  from = "/api/*"
  to = "https://dragonball-api.com/api/:splat"
  status = 200
  force = true

# Cualquier otra ruta (/quiz, /personaje/1...) carga la app; evita el error 404 al recargar
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
